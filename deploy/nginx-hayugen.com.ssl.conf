# HAYUGEN maison — TLS. Installed after certbot issues hayugen.com.
# Isolated from dewebam.com, casino vhosts, and the raw server IP.

upstream hayugen_maison {
    server 127.0.0.1:4174;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hayugen.com www.hayugen.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://hayugen.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hayugen.com;

    ssl_certificate /etc/letsencrypt/live/hayugen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hayugen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hayugen.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hayugen.com;

    ssl_certificate /etc/letsencrypt/live/hayugen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hayugen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://hayugen_maison;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }
}
