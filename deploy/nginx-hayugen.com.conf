# HAYUGEN maison — hayugen.com / www.hayugen.com
# Isolated from dewebam.com, casino vhosts, and the raw server IP.

upstream hayugen_maison {
    server 127.0.0.1:4174;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hayugen.com www.hayugen.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://hayugen_maison;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }
}
