<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search — HAYUGEN</title>
    <link rel="icon" href="./img/logo-dark.png" type="image/png">
    <link rel="stylesheet" href="./css/store.css?v=30">
  </head>
  <body data-page="search">
    <div id="site-header"></div>
    <main class="page">
      <p class="page-kicker">Search</p>
      <h1 class="page-title">Find a piece</h1>
      <form class="search-form" id="search">
        <input id="q" name="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Saryan, cotton, cap…" required>
        <button class="btn" type="submit">Search</button>
      </form>
      <div class="editions" id="results" style="margin-top:2.4rem"></div>
    </main>
    <div id="site-footer"></div>
    <script src="./js/catalog.js"></script>
    <script src="./js/app.js?v=16"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const q = params.get("q") || "";
      document.getElementById("q").value = q;
      const run = (query) => {
        if (!query) return;
        HAYUGEN.api.catalog("?q=" + encodeURIComponent(query)).then((items) => {
          document.getElementById("results").innerHTML = items.length
            ? items.map(HAYUGEN.card).join("")
            : "<p class='lede'>Nothing in the salon matches that.</p>";
        });
      };
      if (q) run(q);
      document.getElementById("search").addEventListener("submit", (event) => {
        event.preventDefault();
        const next = new FormData(event.target).get("q");
        history.replaceState(null, "", "./search.html?q=" + encodeURIComponent(next));
        run(next);
      });
    </script>
  </body>
</html>
